services:
  mysql:
    image: mysql:8.4
    command:
      # binary logging is on by default; this lets the app user create the ledger triggers
      - --log-bin-trust-function-creators=1
      # LOCAL DEVELOPMENT ONLY: flush the redo log about once a second instead of at every
      # commit (much faster on Docker's virtual disk). Never use this for real money.
      - --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payforge
      MYSQL_USER: payforge
      MYSQL_PASSWORD: payforge
    ports: ["3307:3306"]
    volumes:
      - mysqldata:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports: ["6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysqldata:
