name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: payforge_test
          MYSQL_USER: payforge
          MYSQL_PASSWORD: payforge
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7
        ports: ["6381:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management
        ports: ["5673:5672", "15673:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/api/src apps/simbank/src
      # binary logging is on by default; allow the app user to create the ledger triggers
      - run: mysql -h 127.0.0.1 -P 3307 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"
      # SeaweedFS (S3 API) needs a start command, which service containers can't take
      - run: |
          docker run -d -p 8333:8333 -e AWS_ACCESS_KEY_ID=payforge \
            -e AWS_SECRET_ACCESS_KEY=payforge-secret chrislusf/seaweedfs:4.54 server -s3 -dir=/data
          timeout 60 sh -c 'until curl -s -o /dev/null http://127.0.0.1:8333; do sleep 1; done'
      - run: uv run pytest
