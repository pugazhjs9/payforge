[project]
name = "demo-shop"
version = "0.1.0"
description = "A tiny merchant shop that takes payments through PayForge and receives its webhooks."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
