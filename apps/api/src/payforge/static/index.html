<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayForge · Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="card row">
    <div class="row">
      <img id="logo" class="logo" alt="" hidden>
      <div>
        <h1 id="merchant">PayForge</h1>
        <div class="muted" id="user"></div>
        <label class="muted">Logo (PNG or JPEG, up to 512 KB):
          <input id="logo-file" type="file" accept="image/png,image/jpeg"></label>
        <div class="error" id="logo-error"></div>
      </div>
    </div>
    <button class="secondary" id="logout">Log out</button>
  </div>

  <div class="card">
    <h2>API keys</h2>
    <p class="muted">Your server exchanges a key for a 15-minute access token at <code>POST /v1/auth/token</code>.</p>
    <table>
      <thead><tr><th>Name</th><th>Key ID</th><th>Scopes</th><th></th></tr></thead>
      <tbody id="keys"></tbody>
    </table>
    <form id="create">
      <label for="name">New key name</label>
      <input id="name" type="text" required maxlength="100" placeholder="web shop server">
      <div class="scopes">
        <label><input type="checkbox" value="payments:read" checked> payments:read</label>
        <label><input type="checkbox" value="payments:write" checked> payments:write</label>
        <label><input type="checkbox" value="refunds:write" checked> refunds:write</label>
      </div>
      <button type="submit">Create key</button>
      <div class="error" id="error"></div>
    </form>
    <div id="secret"></div>
  </div>

  <div class="card">
    <h2>Webhooks</h2>
    <p class="muted">PayForge POSTs events to these URLs, signed in the <code>PayForge-Signature</code> header.
      Failed deliveries are retried for about 7 hours.</p>
    <table>
      <thead><tr><th>URL</th><th>Events</th><th></th></tr></thead>
      <tbody id="endpoints"></tbody>
    </table>
    <form id="add-endpoint">
      <label for="url">Endpoint URL</label>
      <input id="url" type="url" required maxlength="500" placeholder="https://shop.example/webhooks">
      <button type="submit">Add endpoint</button>
      <div class="error" id="endpoint-error"></div>
    </form>
    <div id="endpoint-secret"></div>
    <div id="deliveries"></div>
  </div>
</main>
<script src="app.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  async function refreshKeys() {
    const { data } = await api("GET", "/dashboard/api-keys");
    $("keys").replaceChildren(
      ...data.map((key) =>
        el("tr", {},
          el("td", {}, key.name),
          el("td", {}, el("code", {}, key.id), " …" + key.secret_last4),
          el("td", {}, key.scopes.join(", ")),
          el("td", {}, key.revoked_at
            ? "revoked"
            : el("button", { class: "danger", onclick: async () => {
                await api("DELETE", `/dashboard/api-keys/${key.id}`);
                refreshKeys();
              } }, "Revoke")),
        ),
      ),
    );
  }

  $("create").onsubmit = async (event) => {
    event.preventDefault();
    $("error").textContent = "";
    const scopes = [...document.querySelectorAll(".scopes input:checked")].map((box) => box.value);
    try {
      const key = await api("POST", "/dashboard/api-keys", { name: $("name").value, scopes });
      $("secret").replaceChildren(
        el("div", { class: "secret" },
          el("strong", {}, "Copy this secret now. It won't be shown again."), el("br"),
          "Key ID: ", el("code", {}, key.id), el("br"),
          "Secret: ", el("code", {}, key.secret)),
      );
      $("name").value = "";
      refreshKeys();
    } catch (err) {
      $("error").textContent = err.message;
    }
  };

  async function refreshEndpoints() {
    const { data } = await api("GET", "/dashboard/webhook-endpoints");
    $("endpoints").replaceChildren(
      ...data.map((hook) =>
        el("tr", {},
          el("td", {}, el("code", {}, hook.url)),
          el("td", {}, hook.event_types.join(", ")),
          el("td", {},
            el("button", { class: "secondary", onclick: () => showDeliveries(hook) }, "Deliveries"),
            " ",
            el("button", { class: "danger", onclick: async () => {
              await api("DELETE", `/dashboard/webhook-endpoints/${hook.id}`);
              $("deliveries").replaceChildren();
              refreshEndpoints();
            } }, "Delete")),
        ),
      ),
    );
  }

  async function showDeliveries(hook) {
    const { data } = await api("GET", `/dashboard/webhook-endpoints/${hook.id}/deliveries`);
    const rows = data.map((d) =>
      el("tr", {},
        el("td", {}, d.event_type, el("br"), el("code", {}, d.event_id)),
        el("td", {}, `${d.status} (${d.attempts} attempt${d.attempts === 1 ? "" : "s"})`),
        el("td", {}, d.last_status_code ? `HTTP ${d.last_status_code}` : (d.last_error ?? "")),
        el("td", {}, d.status === "pending" ? "" : el("button", { class: "secondary", onclick: async () => {
          await api("POST", `/dashboard/webhook-deliveries/${d.id}/resend`);
          showDeliveries(hook);
        } }, "Resend")),
      ));
    $("deliveries").replaceChildren(
      el("h3", {}, "Recent deliveries to ", el("code", {}, hook.url)),
      rows.length
        ? el("table", {}, el("tbody", {}, ...rows))
        : el("p", { class: "muted" }, "Nothing sent yet."),
    );
  }

  $("add-endpoint").onsubmit = async (event) => {
    event.preventDefault();
    $("endpoint-error").textContent = "";
    try {
      const hook = await api("POST", "/dashboard/webhook-endpoints", { url: $("url").value });
      $("endpoint-secret").replaceChildren(
        el("div", { class: "secret" },
          el("strong", {}, "Signing secret (shown once): "), el("code", {}, hook.secret)),
      );
      $("url").value = "";
      refreshEndpoints();
    } catch (err) {
      $("endpoint-error").textContent = err.message;
    }
  };

  function showLogo(url) {
    if (!url) return;
    $("logo").src = url;
    $("logo").hidden = false;
  }

  // The file goes from the browser straight to S3 with a presigned form;
  // the API only signs the form and checks the result.
  $("logo-file").onchange = async () => {
    const file = $("logo-file").files[0];
    $("logo-error").textContent = "";
    if (!file) return;
    try {
      const form = await api("POST", "/dashboard/logo/upload", { content_type: file.type });
      const body = new FormData();
      Object.entries(form.fields).forEach(([name, value]) => body.append(name, value));
      body.append("file", file);  // must come after the fields
      const uploaded = await fetch(form.url, { method: "POST", body });
      if (!uploaded.ok) throw new Error("Upload refused: PNG or JPEG, at most 512 KB.");
      showLogo((await api("PUT", "/dashboard/logo", { key: form.key })).logo_url);
    } catch (err) {
      $("logo-error").textContent = err.message;
    }
  };

  $("logout").onclick = async () => {
    await api("POST", "/auth/logout");
    location.href = "/app/login.html";
  };

  loadMe()
    .then((me) => {
      $("merchant").textContent = me.merchant.name;
      $("user").textContent = `${me.user.email} · ${me.user.role}`;
      showLogo(me.merchant.logo_url);
      return Promise.all([refreshKeys(), refreshEndpoints()]);
    })
    .catch((err) => {
      if (err.status === 401) location.href = "/app/login.html";
    });
</script>
</body>
</html>
