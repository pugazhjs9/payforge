[project]
name = "payforge-api"
version = "0.1.0"
description = "PayForge API: payments, refunds and a double-entry ledger."
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.2.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncmy>=0.2.18",
    "boto3>=1.44.9",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "python-ulid>=4.2.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payforge"
