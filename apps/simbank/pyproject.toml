[project]
name = "simbank"
version = "0.1.0"
description = "A pretend bank for PayForge: test card tokens, charges idempotent by reference."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
