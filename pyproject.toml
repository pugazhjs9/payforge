[project]
name = "payforge"
version = "0.1.0"
description = "A multi-merchant payment gateway API (FastAPI + MySQL)."
requires-python = ">=3.13"
dependencies = ["payforge-api", "simbank"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*"]

[tool.uv.sources]
payforge-api = { workspace = true }
simbank = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["payforge", "simbank"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "S603", "S608"]
"**/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["apps/simbank/tests", "apps/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
